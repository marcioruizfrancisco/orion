# ============================================================
# Orion - Stack: Mailpit (e-mail)
#
# Servidor SMTP + caixa de entrada web + API REST de e-mail.
#
#   SMTP (o que as outras Stacks usam) : orion-mailpit:1025
#   Interface web e API                : http://localhost:${MAILPIT_UI_PORT}
#   Enviar e-mail via API              : POST /api/v1/send
#
# Captura TODO e-mail enviado para ele; nada sai para a internet.
# Para enviar e-mail real, troque SMTP_HOST/SMTP_USER/SMTP_PASSWORD
# no .env por um provedor (SES, Resend, Brevo...).
# ============================================================

services:

  mailpit:

    image: ${MAILPIT_IMAGE}

    container_name: ${MAILPIT_CONTAINER_NAME}

    restart: unless-stopped

    environment:
      MP_DATA_FILE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      # Aceita qualquer login SMTP, com ou sem TLS: as Stacks do Orion
      # só precisam apontar para o host, sem configurar autenticação.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      TZ: ${ORION_TZ}

    ports:
      - "${MAILPIT_UI_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"

    volumes:
      - ${MAILPIT_DATA_PATH}:/data

    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    labels:
      traefik.enable: "true"
      traefik.http.routers.mailpit.rule: "Host(`${MAILPIT_HOSTNAME}`)"
      traefik.http.routers.mailpit.entrypoints: "websecure"
      traefik.http.routers.mailpit.tls.certresolver: "orion-resolver"
      traefik.http.services.mailpit.loadbalancer.server.port: "8025"

    networks:
      - orion

networks:

  orion:
    external: true
    name: ${ORION_NETWORK}
